<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 15px;
        }

        .form-control:focus {
            outline: none;
            border-color: #007bff;
        }

        .login-button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 5px;

            background: #007bff;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #0056b3;
        }

        .error-message {
            color: #dc3545;
            margin-bottom: 15px;
            text-align: center;
        }

        .field-error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h2>Login</h2>

            {% if form.non_field_errors %}
                <div class="error-message">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">

                {% csrf_token %}

                <div class="form-group">

                    <label for="id_username">
                        Username
                    </label>

                    {{ form.username }}

                    {% if form.username.errors %}
                        <div class="field-error">
                            {{ form.username.errors }}
                        </div>
                    {% endif %}

                </div>

                <div class="form-group">

                    <label for="id_password">
                        Password
                    </label>

                    {{ form.password }}

                    {% if form.password.errors %}
                        <div class="field-error">
                            {{ form.password.errors }}
                        </div>
                    {% endif %}

                </div>

                <button
                    type="submit"
                    class="login-button">
                    Login
                </button>

            </form>

        </div>

    </div>

</body>

</html>
